<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Ward Life GH, admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: #F3F6F8; }
    .adm { max-width: 1100px; }
    .kpi { background: #fff; border-radius: 18px; padding: 1.1rem 1.25rem; height: 100%; }
    .kpi small { color: #5A6B80; font-weight: 600; display: flex; align-items: center; gap: .4rem; }
    .kpi .big { font-size: clamp(1.7rem, 3.4vw, 2.4rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; margin: .25rem 0; }
    .kpi .sub { color: #5A6B80; font-size: .85rem; }
    .panel { background: #fff; border-radius: 18px; padding: 1.1rem 1.25rem; }
    .panel h2 { font-size: 1rem; font-weight: 700; }
    .chart svg { width: 100%; height: 220px; display: block; }
    .chart text { font: 11px var(--font); fill: #5A6B80; }
    .key span { display: inline-flex; align-items: center; gap: .35rem; margin-right: 1rem; font-size: .82rem; }
    .key i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
    table { font-size: .9rem; }
  </style>
</head>
<body>
<div class="container adm py-4">
  <div class="d-flex align-items-center flex-wrap gap-3 mb-1">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Ward Life GH, admin</div>
    <div class="ms-auto btn-group" role="group" aria-label="Range">
      <input type="radio" class="btn-check" name="range" id="r7" value="7"><label class="btn btn-outline-secondary btn-sm" for="r7">7 days</label>
      <input type="radio" class="btn-check" name="range" id="r30" value="30" checked><label class="btn btn-outline-secondary btn-sm" for="r30">30 days</label>
    </div>
    <button class="btn btn-sm btn-outline-secondary" id="refresh" aria-label="Refresh"><i class="bi bi-arrow-clockwise"></i></button>
  </div>
  <p class="text-body-secondary small mb-4" id="updated">Enter the admin token to load the dashboard.</p>

  <form id="tokenForm" class="panel mb-4" style="max-width: 420px">
    <label class="form-label fw-semibold" for="tok">Admin token</label>
    <input class="form-control mb-2" id="tok" type="password" autocomplete="off">
    <button class="btn btn-scrub" type="submit">Open dashboard</button>
    <div class="text-danger small mt-2" id="tokErr"></div>
  </form>

  <div id="dash" class="d-none">
    <div class="row g-3 mb-3" id="kpis"></div>
    <div class="panel mb-3 chart">
      <div class="d-flex flex-wrap align-items-center mb-2"><h2 class="mb-0 me-auto">Traffic</h2>
        <div class="key"><span><i style="background:#0E7C7B"></i>Visits</span><span><i style="background:#E9B824"></i>Unique visitors</span><span><i style="background:#1E5AA8"></i>Sign-ups</span></div></div>
      <div id="chart"></div>
    </div>
    <div class="row g-3">
      <div class="col-md-6"><div class="panel h-100"><h2>Players by role</h2><table class="table table-sm mb-0" id="roles"></table></div></div>
      <div class="col-md-6"><div class="panel h-100"><h2>Top schools and hospitals</h2><table class="table table-sm mb-0" id="insts"></table></div></div>
      <div class="col-md-6"><div class="panel h-100"><h2>Hospital activity today</h2><table class="table table-sm mb-0" id="game"></table></div></div>
      <div class="col-md-6"><div class="panel h-100"><h2>Where visitors come from (30 days)</h2><table class="table table-sm mb-0" id="refs"></table></div></div>
      <div class="col-12"><div class="panel"><h2>Top players</h2><table class="table table-sm mb-0" id="top"></table></div></div>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
